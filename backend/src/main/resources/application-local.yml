spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/treasureverse?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:treasureverse}
    password: ${DB_PASSWORD:treasureverse}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  docker:
    compose:
      enabled: false

app:
  storage:
    bucket: ${MINIO_BUCKET:treasureverse-local}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    path-style-access: true
