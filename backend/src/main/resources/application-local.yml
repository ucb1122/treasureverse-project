spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/treasureverse?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:treasureverse}
    password: ${DB_PASSWORD:treasureverse}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      enabled: false
