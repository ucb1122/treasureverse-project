spring:
  application:
    name: treasureverse-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
  web:
    locale: ko_KR

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  jwt:
    secret: ${JWT_SECRET:treasureverse-local-development-secret-key-change-me-1234567890}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:1800}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:1209600}
  storage:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}
    max-image-bytes: ${MAX_IMAGE_BYTES:10485760}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
