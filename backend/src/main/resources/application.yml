spring:
  application:
    name: treasureverse-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
  web:
    locale: ko_KR

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
