spring:
  datasource:
    url: jdbc:h2:mem:treasureverse;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  docker:
    compose:
      enabled: false

app:
  jwt:
    secret: treasureverse-test-secret-key-that-is-long-enough-for-hmac-sha
    access-token-seconds: 1800
    refresh-token-seconds: 1209600
